[workspace]
members = ["bench"]
# Root `cargo build` / `cargo test` / `cargo doc` stay scoped to the library
# only, so the bench crate's rdkafka C/cmake toolchain is never pulled in
# unless someone explicitly targets `-p kafka-client-bench`.
default-members = ["."]
resolver = "2"

[package]
name = "kafka-client"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["net", "io-util", "rt", "rt-multi-thread", "macros", "sync", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = "0.26"
zeroize = "1"
tracing = "0.1"
kafka-protocol = { version = "0.17", default-features = false, features = ["client", "gzip"] }
bytes = "1"
anyhow = "1"
fastrand = "2"
arc-swap = "1"
zeropool = "0.3"
socket2 = "0.6.3"
murmur2 = "0.1"
futures-core = "0.3"
crc32c = "0.6"

[dev-dependencies]
kafka-protocol = { version = "0.17", default-features = false, features = ["client", "broker", "gzip"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["kafka"] }
tokio = { version = "1", features = ["full", "test-util"] }
rustls-pemfile = "2"
tracing-test = "0.2"
